<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>fah timer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f2f0eb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="fah timer">
<link rel="icon" href="data:,">
<style>
:root{
  --paper:#f2f0eb; --ink:#111110;
  --bg:var(--paper); --fg:var(--ink);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#000; --fg:#f2f0eb; }
}
html[data-theme="light"]{ --bg:#f2f0eb; --fg:#111110; }
html[data-theme="dark"]{ --bg:#000; --fg:#f2f0eb; }
/* running: jump is black, rest is paper */
body[data-view="run"][data-phase="jump"]{ --bg:#000; --fg:#f2f0eb; }
body[data-view="run"][data-phase="rest"],
body[data-view="run"][data-phase="ready"]{ --bg:#f2f0eb; --fg:#111110; }

*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; }
html{ background:var(--bg); transition:background-color .9s ease; }
body{
  background:var(--bg); color:var(--fg);
  transition:background-color .9s ease, color .9s ease;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
  font-weight:300;
  -webkit-font-smoothing:antialiased;
  min-height:100vh; min-height:100dvh;
  overflow:hidden; user-select:none; -webkit-user-select:none;
  overscroll-behavior:none; touch-action:manipulation;
}
button{
  font:inherit; color:inherit; background:none; border:0; border-radius:0;
  cursor:pointer; letter-spacing:inherit; text-transform:inherit;
  outline:none;
}
button:focus-visible{ opacity:1 !important; text-decoration:underline; text-underline-offset:.5em; }

.label{
  font-size:11px; font-weight:400; letter-spacing:.42em; text-transform:uppercase;
  padding-left:.42em; /* optically recentre tracked text */
}
.view{
  position:fixed; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:calc(env(safe-area-inset-top) + 8vh) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  transition:opacity .5s ease, visibility .5s;
}
body[data-view="setup"] #run, body[data-view="run"] #setup{ opacity:0; visibility:hidden; pointer-events:none; }

/* wordmark */
#mark{
  position:fixed; z-index:2; top:calc(env(safe-area-inset-top) + clamp(24px,7vh,64px)); left:50%; transform:translateX(-50%);
  font-size:22px; line-height:1.12; font-weight:400; letter-spacing:-.03em; text-align:center;
  text-transform:none; white-space:nowrap; pointer-events:none; color:var(--fg);
}

/* setup */
#setup{ gap:clamp(28px,7vh,64px); }
.field{ display:flex; flex-direction:column; align-items:center; gap:4px; }
.row{ display:flex; align-items:center; justify-content:center; }
.num{
  font-size:clamp(88px,30vw,200px); line-height:1; font-weight:200;
  font-variant-numeric:tabular-nums; letter-spacing:-.04em;
  min-width:2.1ch; text-align:center;
}
.num.long{ font-size:clamp(56px,20vw,128px); min-width:2.6ch; }
.step, .sub button{ touch-action:none; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
.step{
  width:64px; height:88px; font-size:30px; font-weight:200; opacity:.35;
  transition:opacity .2s;
}
.sub{ display:flex; align-items:center; justify-content:center; margin-top:2px; }
.sub button{ width:56px; height:44px; font-size:20px; font-weight:200; opacity:.3; transition:opacity .2s; }
.sub button:active{ opacity:1; }
@media (hover:hover){ .sub button:hover{ opacity:.8; } }
.sub .label{ font-size:10px; opacity:.4; min-width:44px; text-align:center; padding-left:.42em; }
.step:active{ opacity:1; }
@media (hover:hover){ .step:hover{ opacity:.8; } }
.word{
  font-size:13px; font-weight:400; letter-spacing:.5em; text-transform:uppercase;
  padding:22px 0 22px .5em; min-width:160px;
}
#start{ margin-top:clamp(0px,2vh,16px); }
#theme{
  position:fixed; top:calc(env(safe-area-inset-top) + 14px); right:calc(env(safe-area-inset-right) + 8px);
  font-size:10px; letter-spacing:.38em; padding:14px 12px 14px 20px; opacity:.3;
  transition:opacity .2s;
}
@media (hover:hover){ #theme:hover{ opacity:.8; } }
body[data-view="run"] #theme{ display:none; }

/* run */
#run{ cursor:pointer; gap:clamp(8px,2vh,20px); }
#phase{ opacity:.55; }
#count{
  font-size:clamp(120px,52vw,420px); line-height:.9; font-weight:100;
  font-variant-numeric:tabular-nums; letter-spacing:-.05em;
  padding-right:.05em; transition:opacity .4s ease;
}
#count.long{ font-size:clamp(72px,36vw,300px); letter-spacing:-.06em; }
@media (min-aspect-ratio:1/1){ #count{ font-size:min(52vh,40vw); } #count.long{ font-size:min(46vh,30vw); } }
#round{ opacity:.4; margin-top:clamp(8px,3vh,28px); }
#bar{
  position:fixed; left:0; right:0; top:0; height:1px;
  margin-top:env(safe-area-inset-top);
  background:var(--fg); opacity:.7; transform-origin:0 50%; transform:scaleX(0);
}
#stop{
  position:fixed; bottom:calc(env(safe-area-inset-bottom) + 22px); left:50%; transform:translateX(-50%);
  font-size:11px; font-weight:400; letter-spacing:.42em; padding:20px 24px 20px calc(24px + .42em);
  opacity:.35; transition:opacity .2s;
}
@media (hover:hover){ #stop:hover{ opacity:.9; } }
body.paused #count{ opacity:.25; }
body.paused #phase{ opacity:.9; }
@media (prefers-reduced-motion:reduce){ html,body,.view{ transition:none; } }
</style>
</head>
<body data-view="setup" data-phase="jump">

<div id="mark" aria-hidden="true">fahhhhhh<br>time</div>

<button id="theme" type="button" class="label" aria-label="Toggle light or dark">Dark</button>

<main id="setup" class="view">
  <div class="field">
    <div class="label">Work</div>
    <div class="row">
      <button class="step" type="button" data-k="jump" data-u="m" data-d="-1" aria-label="Decrease work by one minute">&minus;</button>
      <div class="num" id="jumpN" aria-live="polite">60</div>
      <button class="step" type="button" data-k="jump" data-u="m" data-d="1" aria-label="Increase work by one minute">+</button>
    </div>
    <div class="sub">
      <button type="button" data-k="jump" data-u="s" data-d="-1" aria-label="Decrease work seconds">&minus;</button>
      <span class="label" aria-hidden="true">sec</span>
      <button type="button" data-k="jump" data-u="s" data-d="1" aria-label="Increase work seconds">+</button>
    </div>
  </div>
  <div class="field">
    <div class="label">Rest</div>
    <div class="row">
      <button class="step" type="button" data-k="rest" data-u="m" data-d="-1" aria-label="Decrease rest by one minute">&minus;</button>
      <div class="num" id="restN" aria-live="polite">30</div>
      <button class="step" type="button" data-k="rest" data-u="m" data-d="1" aria-label="Increase rest by one minute">+</button>
    </div>
    <div class="sub">
      <button type="button" data-k="rest" data-u="s" data-d="-1" aria-label="Decrease rest seconds">&minus;</button>
      <span class="label" aria-hidden="true">sec</span>
      <button type="button" data-k="rest" data-u="s" data-d="1" aria-label="Increase rest seconds">+</button>
    </div>
  </div>
  <button id="start" class="word" type="button">Start</button>
</main>

<main id="run" class="view" aria-live="off">
  <div id="bar"></div>
  <div id="phase" class="label">Work</div>
  <div id="count">60</div>
  <div id="round" class="label">Round 1</div>
  <button id="stop" type="button" class="label">Stop</button>
</main>

<script>
(function(){
  "use strict";
  var KEY="jumprope.v1", MIN=5, MAX=99*60, STEP=5;
  var $=function(id){return document.getElementById(id);};
  var body=document.body, root=document.documentElement;

  /* ---------- settings ---------- */
  var S={jump:60,rest:30,theme:null};
  try{
    var raw=JSON.parse(localStorage.getItem(KEY)||"null");
    if(raw){
      if(isFinite(raw.jump)) S.jump=clamp(+raw.jump);
      if(isFinite(raw.rest)) S.rest=clamp(+raw.rest);
      if(raw.theme==="light"||raw.theme==="dark") S.theme=raw.theme;
    }
  }catch(e){}
  function clamp(v){ v=Math.round(v/STEP)*STEP; return Math.max(MIN,Math.min(MAX,v)); }
  function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }

  var mq=window.matchMedia("(prefers-color-scheme: dark)");
  function isDark(){ return S.theme?S.theme==="dark":mq.matches; }
  function paintTheme(){
    if(S.theme) root.setAttribute("data-theme",S.theme); else root.removeAttribute("data-theme");
    $("theme").textContent=isDark()?"Light":"Dark";
  }
  $("theme").addEventListener("click",function(){
    S.theme=isDark()?"light":"dark"; save(); paintTheme();
  });
  if(mq.addEventListener) mq.addEventListener("change",paintTheme);

  function fmt(t){
    if(t<60) return String(t);
    var r=t%60;
    return Math.floor(t/60)+":"+(r<10?"0":"")+r;
  }
  function paintSetup(){
    [["jump","jumpN"],["rest","restN"]].forEach(function(p){
      var el=$(p[1]), v=S[p[0]];
      el.textContent=fmt(v); el.classList.toggle("long",v>=60);
    });
  }
  /* seconds step: 5s under a minute, 15s from a minute up (decreasing from exactly 1:00 goes to 0:55) */
  function secStep(v){ return v<60?5:15; }
  function adjust(k,unit,dir){
    var v=S[k], n;
    if(unit==="m") n=v+dir*60;
    else if(dir>0){ var a=secStep(v); n=Math.floor(v/a)*a+a; }
    else{ var b=secStep(v-1); n=Math.ceil(v/b)*b-b; }
    n=Math.max(MIN,Math.min(MAX,n));
    if(n===v) return false;
    S[k]=n; save(); paintSetup();
    if(navigator.vibrate) try{navigator.vibrate(8);}catch(e){}
    return true;
  }
  /* press and hold repeats, accelerating */
  var holdT=0, holdOwner=null;
  function stopHold(){ clearTimeout(holdT); holdT=0; holdOwner=null; }
  function bindStep(b){
    var k=b.getAttribute("data-k"), u=b.getAttribute("data-u"), d=+b.getAttribute("data-d");
    var viaPointer=false;
    b.addEventListener("pointerdown",function(e){
      if(e.pointerType==="mouse"&&e.button!==0) return;
      viaPointer=true; stopHold(); holdOwner=b;
      adjust(k,u,d);
      var wait=420, n=0;
      (function rep(){
        holdT=setTimeout(function(){
          adjust(k,u,d); n++;
          wait=Math.max(u==="m"?60:70,wait*0.86);
          rep();
        },wait);
      })();
    });
    ["pointerup","pointercancel","pointerleave","blur"].forEach(function(ev){ b.addEventListener(ev,function(){ if(holdOwner===b) stopHold(); }); });
    b.addEventListener("contextmenu",function(e){ e.preventDefault(); });
    /* keyboard activation only (pointer taps are handled above) */
    b.addEventListener("click",function(){ if(viaPointer) viaPointer=false; else adjust(k,u,d); });
  }
  Array.prototype.forEach.call(document.querySelectorAll(".step, .sub button"),bindStep);

  /* ---------- audio ----------
     Sounds are rendered once as 16-bit WAV (plain sample math) and played through
     HTMLAudioElements. Unlike Web Audio, media elements are NOT muted by the iOS
     silent switch. Web Audio is only a fallback if an element refuses to play. */
  var SR=44100, snd={}, ac=null, lastAt={}, audioReady=false;
  try{ if(navigator.audioSession) navigator.audioSession.type="playback"; }catch(e){}

  function renderBeep(freq,dur,vol){
    var n=Math.floor(SR*dur), d=new Float32Array(n), ph=0, i, t, g;
    for(i=0;i<n;i++){
      t=i/SR;
      g=t<0.006?t/0.006:(t>dur-0.03?Math.max(0,(dur-t)/0.03):1);
      ph+=freq/SR; ph-=Math.floor(ph);
      d[i]=(ph<0.5?1:-1)*vol*g;
    }
    return d;
  }
  /* falling "fahhhh": saw + triangle sweeping 440Hz to 110Hz through a sweeping low-pass */
  function renderFahh(){
    var dur=1.3, n=Math.floor(SR*(dur+0.05)), d=new Float32Array(n), i, t, k, peak=0;
    var p1=0, p2=0, x1=0, x2=0, y1=0, y2=0, b0=0, b1=0, b2=0, a1=0, a2=0, Q=2;
    for(i=0;i<n;i++){
      t=Math.min(i/SR,dur); k=t/dur;
      var f1=440*Math.pow(110/440,k), f2=442*Math.pow(110.5/442,k);
      p1+=f1/SR; p1-=Math.floor(p1); p2+=f2/SR; p2-=Math.floor(p2);
      var x=(2*p1-1)+(Math.abs(4*p2-2)-1);
      if(i%16===0){
        var fc=2600*Math.pow(500/2600,k), w=2*Math.PI*fc/SR, al=Math.sin(w)/(2*Q), c=Math.cos(w), a0=1+al;
        b0=(1-c)/2/a0; b1=(1-c)/a0; b2=b0; a1=-2*c/a0; a2=(1-al)/a0;
      }
      var y=b0*x+b1*x1+b2*x2-a1*y1-a2*y2;
      x2=x1; x1=x; y2=y1; y1=y;
      var g=t<0.05?t/0.05:(t<0.45?1:Math.pow(0.0001,(t-0.45)/(dur-0.45)));
      if(i>=SR*dur) g=0;
      d[i]=y*g; if(Math.abs(d[i])>peak) peak=Math.abs(d[i]);
    }
    /* normalise hard, then soft-clip a touch for extra loudness */
    var s=0.97/(peak||1);
    for(i=0;i<n;i++){ d[i]=Math.tanh(d[i]*s*1.6)/Math.tanh(1.6)*0.98; }
    return d;
  }
  function wavURI(f32){
    var n=f32.length, buf=new ArrayBuffer(44+n*2), v=new DataView(buf), i;
    function s(o,str){ for(var j=0;j<str.length;j++) v.setUint8(o+j,str.charCodeAt(j)); }
    s(0,"RIFF"); v.setUint32(4,36+n*2,true); s(8,"WAVE"); s(12,"fmt ");
    v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
    v.setUint32(24,SR,true); v.setUint32(28,SR*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
    s(36,"data"); v.setUint32(40,n*2,true);
    for(i=0;i<n;i++){ var x=Math.max(-1,Math.min(1,f32[i])); v.setInt16(44+i*2,x<0?x*32768:x*32767,true); }
    var bytes=new Uint8Array(buf), bin="";
    for(i=0;i<bytes.length;i+=8192) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
    return "data:audio/wav;base64,"+btoa(bin);
  }
  function mk(name,data){
    var a=new Audio();
    a.preload="auto"; a.volume=1; a.setAttribute("playsinline",""); a.setAttribute("webkit-playsinline","");
    a.src=wavURI(data);
    try{ a.load(); }catch(e){}
    snd[name]={el:a,data:data};
  }
  /* real recorded "fah" (mp3). The synthesized one is rendered only if the file fails to load. */
  function mkFile(name,url,fallback){
    var a=new Audio(), swapped=false;
    a.preload="auto"; a.volume=1; a.setAttribute("playsinline",""); a.setAttribute("webkit-playsinline","");
    var entry={el:a,data:null};
    a.addEventListener("error",function(){
      if(swapped) return; swapped=true;
      try{
        entry.data=fallback();
        a.src=wavURI(entry.data);
        try{ a.load(); }catch(e){}
      }catch(e){}
    });
    a.src=url;
    try{ a.load(); }catch(e){}
    snd[name]=entry;
  }
  try{
    mk("start",renderBeep(1320,0.3,0.95));
    mk("tick",renderBeep(880,0.14,0.95));
    mkFile("fahh","fah.mp3?v=3",renderFahh);
    audioReady=true;
  }catch(e){}

  function ensureCtx(){
    try{
      var C=window.AudioContext||window.webkitAudioContext;
      if(!C) return null;
      if(!ac) ac=new C();
      if(ac.state!=="running"&&ac.resume){ var r=ac.resume(); if(r&&r.catch) r.catch(function(){}); }
      return ac;
    }catch(e){ return null; }
  }
  function webAudioFallback(name){
    try{
      var c=ensureCtx(), s=snd[name]; if(!c||!s||!s.data) return;
      var b=c.createBuffer(1,s.data.length,SR); b.getChannelData(0).set(s.data);
      var src=c.createBufferSource(); src.buffer=b; src.connect(c.destination); src.start(0);
    }catch(e){}
  }
  /* must run synchronously inside the START / resume tap (iOS Safari) */
  function initAudio(skip){
    try{ if(navigator.audioSession) navigator.audioSession.type="playback"; }catch(e){}
    ensureCtx();
    if(!audioReady) return;
    /* 'skip' is a sound played for real inside this same tap */
    ["start","tick","fahh"].forEach(function(name){
      if(name===skip) return;
      var a=snd[name].el;
      try{
        /* a muted play inside the gesture unlocks this element for later script-started play() */
        a.muted=true;
        var p=a.play();
        var done=function(){ try{ a.pause(); a.currentTime=0; }catch(e){} a.muted=false; };
        if(p&&p.then) p.then(done,function(){ a.muted=false; }); else done();
      }catch(e){ a.muted=false; }
    });
  }
  function play(name){
    var s=snd[name]; if(!s){ return; }
    var a=s.el;
    try{
      a.muted=false; a.volume=1;
      try{ a.currentTime=0; }catch(e){}
      var p=a.play();
      if(p&&p.catch) p.catch(function(){ webAudioFallback(name); });
    }catch(e){ webAudioFallback(name); }
  }
  function stopSounds(){
    Object.keys(snd).forEach(function(k){ try{ snd[k].el.pause(); snd[k].el.currentTime=0; }catch(e){} });
  }
  /* ignore a repeat of the same sound kind within 'gap' ms (no double play) */
  function once(kind,gap){
    var n=Date.now();
    if(lastAt[kind]&&n-lastAt[kind]<gap) return false;
    lastAt[kind]=n; return true;
  }
  function buzz(p){ if(navigator.vibrate) try{navigator.vibrate(p);}catch(e){} }
  function tick(){ if(once("tick",400)){ play("tick"); buzz(25); } }
  /* entering rest: fah. entering jump (after get ready or rest): start beep. one sound only. */
  function change(phase){
    if(!once("change",600)) return;
    stopSounds();
    if(phase==="jump"){ play("start"); buzz([220]); }
    else{ play("fahh"); buzz([120,80,120]); }
  }

  /* ---------- wake lock ---------- */
  var lock=null;
  function wake(){
    try{
      if(!("wakeLock" in navigator)||lock) return;
      navigator.wakeLock.request("screen").then(function(l){
        lock=l; l.addEventListener("release",function(){ lock=null; });
      }).catch(function(){});
    }catch(e){}
  }
  function unwake(){ try{ if(lock){ lock.release(); } }catch(e){} lock=null; }
  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState==="visible"&&running&&!paused) wake();
  });

  /* ---------- timer ---------- */
  var running=false, paused=false;
  var phase="jump", round=1;
  var phaseStart=0, phaseEnd=0, remainingAtPause=0, lastShown=-1;
  var raf=0, iv=0;
  function setCount(t){ elCount.textContent=fmt(t); elCount.classList.toggle("long",t>=60); }
  var elCount=$("count"), elPhase=$("phase"), elRound=$("round"), elBar=$("bar");

  var READY=5; /* get ready countdown, seconds */
  function dur(p){ return p==="ready"?READY*1000:S[p]*1000; }
  function paintPhase(){
    body.setAttribute("data-phase",phase);
    elPhase.textContent=paused?"Paused":(phase==="jump"?"Work":phase==="rest"?"Rest":"Get ready");
    elRound.textContent="Round "+round;
  }
  function begin(p,startAt){
    phase=p; phaseStart=startAt; phaseEnd=startAt+dur(p); lastShown=-1;
  }
  function frame(){
    if(!running||paused) return;
    var now=Date.now(), changed=false;
    while(now>=phaseEnd){
      var next=phase==="jump"?"rest":"jump";
      if(phase==="rest") round++;
      begin(next,phaseEnd); changed=true;
    }
    if(changed){ paintPhase(); change(phase); }
    var left=phaseEnd-now;
    var shown=Math.ceil(left/1000);
    if(shown!==lastShown){
      setCount(shown);
      /* jump: ticks at 3,2,1. get ready and rest: beeps at 5,4,3,2,1 */
      var lim=phase==="jump"?3:5;
      if(!changed&&shown<=lim&&shown>=1&&lastShown>shown) tick();
      lastShown=shown;
    }
    elBar.style.transform="scaleX("+Math.min(1,(now-phaseStart)/(phaseEnd-phaseStart))+")";
  }
  /* A Worker timer is not throttled like page timers in hidden tabs; fall back to setInterval. */
  var worker=null;
  function startTicker(){
    stopTicker();
    try{
      var url=URL.createObjectURL(new Blob(["setInterval(function(){postMessage(0)},250)"],{type:"text/javascript"}));
      worker=new Worker(url); URL.revokeObjectURL(url);
      worker.onmessage=frame;
    }catch(e){ worker=null; }
    if(!worker) iv=setInterval(frame,250);
  }
  function stopTicker(){
    if(worker){ try{worker.terminate();}catch(e){} worker=null; }
    clearInterval(iv); iv=0;
  }
  document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible") frame(); });
  function loop(){ frame(); raf=requestAnimationFrame(loop); }

  function start(){
    initAudio("tick");
    running=true; paused=false; round=1;
    body.classList.remove("paused");
    body.setAttribute("data-view","run");
    begin("ready",Date.now());
    elBar.style.transition="none"; elBar.style.transform="scaleX(0)";
    setCount(READY); lastShown=READY;
    paintPhase(); tick(); /* beep for 5 */
    wake();
    cancelAnimationFrame(raf); stopTicker();
    raf=requestAnimationFrame(loop);
    startTicker(); /* keeps ticking if rAF / timers are throttled in the background */
  }
  function stop(){
    running=false; paused=false;
    cancelAnimationFrame(raf); stopTicker();
    stopSounds(); unwake();
    body.classList.remove("paused");
    body.setAttribute("data-view","setup");
    paintSetup();
  }
  function toggle(){
    if(!running) return;
    initAudio();
    if(!paused){
      paused=true; remainingAtPause=phaseEnd-Date.now();
      body.classList.add("paused");
      stopSounds(); unwake();
    }else{
      paused=false;
      var now=Date.now();
      phaseEnd=now+remainingAtPause; phaseStart=phaseEnd-dur(phase);
      body.classList.remove("paused");
      wake();
    }
    paintPhase();
  }

  $("start").addEventListener("click",start);
  $("stop").addEventListener("click",function(e){ e.stopPropagation(); stop(); });
  $("run").addEventListener("click",toggle);
  document.addEventListener("keydown",function(e){
    if(e.key===" "||e.code==="Space"){
      if(running){ e.preventDefault(); toggle(); }
      else if(document.activeElement===document.body){ e.preventDefault(); start(); }
    }else if(e.key==="Escape"&&running) stop();
  });

  paintTheme(); paintSetup();
  /* test hook (harmless) */
  window.__jr={state:function(){return {running:running,paused:paused,phase:phase,round:round};}};
})();
</script>
</body>
</html>
