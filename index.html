<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Jump</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f2f0eb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jump">
<link rel="icon" href="data:,">
<style>
:root{
  --paper:#f2f0eb; --ink:#111110;
  --bg:var(--paper); --fg:var(--ink);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#000; --fg:#f2f0eb; }
}
html[data-theme="light"]{ --bg:#f2f0eb; --fg:#111110; }
html[data-theme="dark"]{ --bg:#000; --fg:#f2f0eb; }
/* running: jump is black, rest is paper */
body[data-view="run"][data-phase="jump"]{ --bg:#000; --fg:#f2f0eb; }
body[data-view="run"][data-phase="rest"]{ --bg:#f2f0eb; --fg:#111110; }

*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; }
html{ background:var(--bg); transition:background-color .9s ease; }
body{
  background:var(--bg); color:var(--fg);
  transition:background-color .9s ease, color .9s ease;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
  font-weight:300;
  -webkit-font-smoothing:antialiased;
  min-height:100vh; min-height:100dvh;
  overflow:hidden; user-select:none; -webkit-user-select:none;
  overscroll-behavior:none; touch-action:manipulation;
}
button{
  font:inherit; color:inherit; background:none; border:0; border-radius:0;
  cursor:pointer; letter-spacing:inherit; text-transform:inherit;
  outline:none;
}
button:focus-visible{ opacity:1 !important; text-decoration:underline; text-underline-offset:.5em; }

.label{
  font-size:11px; font-weight:400; letter-spacing:.42em; text-transform:uppercase;
  padding-left:.42em; /* optically recentre tracked text */
}
.view{
  position:fixed; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  transition:opacity .5s ease, visibility .5s;
}
body[data-view="setup"] #run, body[data-view="run"] #setup{ opacity:0; visibility:hidden; pointer-events:none; }

/* setup */
#setup{ gap:clamp(28px,7vh,64px); }
.field{ display:flex; flex-direction:column; align-items:center; gap:4px; }
.row{ display:flex; align-items:center; justify-content:center; }
.num{
  font-size:clamp(88px,30vw,200px); line-height:1; font-weight:200;
  font-variant-numeric:tabular-nums; letter-spacing:-.04em;
  min-width:2.1ch; text-align:center;
}
.step{
  width:64px; height:88px; font-size:30px; font-weight:200; opacity:.35;
  transition:opacity .2s;
}
.step:active{ opacity:1; }
@media (hover:hover){ .step:hover{ opacity:.8; } }
.word{
  font-size:13px; font-weight:400; letter-spacing:.5em; text-transform:uppercase;
  padding:22px 0 22px .5em; min-width:160px;
}
#start{ margin-top:clamp(0px,2vh,16px); }
#theme{
  position:fixed; top:calc(env(safe-area-inset-top) + 14px); right:calc(env(safe-area-inset-right) + 8px);
  font-size:10px; letter-spacing:.38em; padding:14px 12px 14px 20px; opacity:.3;
  transition:opacity .2s;
}
@media (hover:hover){ #theme:hover{ opacity:.8; } }
body[data-view="run"] #theme{ display:none; }

/* run */
#run{ cursor:pointer; gap:clamp(8px,2vh,20px); }
#phase{ opacity:.55; }
#count{
  font-size:clamp(120px,52vw,420px); line-height:.9; font-weight:100;
  font-variant-numeric:tabular-nums; letter-spacing:-.05em;
  padding-right:.05em; transition:opacity .4s ease;
}
@media (min-aspect-ratio:1/1){ #count{ font-size:min(52vh,40vw); } }
#round{ opacity:.4; margin-top:clamp(8px,3vh,28px); }
#bar{
  position:fixed; left:0; right:0; top:0; height:1px;
  margin-top:env(safe-area-inset-top);
  background:var(--fg); opacity:.7; transform-origin:0 50%; transform:scaleX(0);
}
#stop{
  position:fixed; bottom:calc(env(safe-area-inset-bottom) + 22px); left:50%; transform:translateX(-50%);
  font-size:11px; font-weight:400; letter-spacing:.42em; padding:20px 24px 20px calc(24px + .42em);
  opacity:.35; transition:opacity .2s;
}
@media (hover:hover){ #stop:hover{ opacity:.9; } }
body.paused #count{ opacity:.25; }
body.paused #phase{ opacity:.9; }
@media (prefers-reduced-motion:reduce){ html,body,.view{ transition:none; } }
</style>
</head>
<body data-view="setup" data-phase="jump">

<button id="theme" type="button" class="label" aria-label="Toggle light or dark">Dark</button>

<main id="setup" class="view">
  <div class="field">
    <div class="label">Jump</div>
    <div class="row">
      <button class="step" type="button" data-k="jump" data-d="-5" aria-label="Decrease jump seconds">&minus;</button>
      <div class="num" id="jumpN" aria-live="polite">60</div>
      <button class="step" type="button" data-k="jump" data-d="5" aria-label="Increase jump seconds">+</button>
    </div>
  </div>
  <div class="field">
    <div class="label">Rest</div>
    <div class="row">
      <button class="step" type="button" data-k="rest" data-d="-5" aria-label="Decrease rest seconds">&minus;</button>
      <div class="num" id="restN" aria-live="polite">30</div>
      <button class="step" type="button" data-k="rest" data-d="5" aria-label="Increase rest seconds">+</button>
    </div>
  </div>
  <button id="start" class="word" type="button">Start</button>
</main>

<main id="run" class="view" aria-live="off">
  <div id="bar"></div>
  <div id="phase" class="label">Jump</div>
  <div id="count">60</div>
  <div id="round" class="label">Round 1</div>
  <button id="stop" type="button" class="label">Stop</button>
</main>

<script>
(function(){
  "use strict";
  var KEY="jumprope.v1", MIN=5, MAX=600, STEP=5;
  var $=function(id){return document.getElementById(id);};
  var body=document.body, root=document.documentElement;

  /* ---------- settings ---------- */
  var S={jump:60,rest:30,theme:null};
  try{
    var raw=JSON.parse(localStorage.getItem(KEY)||"null");
    if(raw){
      if(isFinite(raw.jump)) S.jump=clamp(+raw.jump);
      if(isFinite(raw.rest)) S.rest=clamp(+raw.rest);
      if(raw.theme==="light"||raw.theme==="dark") S.theme=raw.theme;
    }
  }catch(e){}
  function clamp(v){ v=Math.round(v/STEP)*STEP; return Math.max(MIN,Math.min(MAX,v)); }
  function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }

  var mq=window.matchMedia("(prefers-color-scheme: dark)");
  function isDark(){ return S.theme?S.theme==="dark":mq.matches; }
  function paintTheme(){
    if(S.theme) root.setAttribute("data-theme",S.theme); else root.removeAttribute("data-theme");
    $("theme").textContent=isDark()?"Light":"Dark";
  }
  $("theme").addEventListener("click",function(){
    S.theme=isDark()?"light":"dark"; save(); paintTheme();
  });
  if(mq.addEventListener) mq.addEventListener("change",paintTheme);

  function paintSetup(){ $("jumpN").textContent=S.jump; $("restN").textContent=S.rest; }
  Array.prototype.forEach.call(document.querySelectorAll(".step"),function(b){
    b.addEventListener("click",function(){
      var k=b.getAttribute("data-k");
      S[k]=clamp(S[k]+(+b.getAttribute("data-d")));
      save(); paintSetup();
      if(navigator.vibrate) try{navigator.vibrate(8);}catch(e){}
    });
  });

  /* ---------- audio ----------
     Sounds are rendered once as 16-bit WAV (plain sample math) and played through
     HTMLAudioElements. Unlike Web Audio, media elements are NOT muted by the iOS
     silent switch. Web Audio is only a fallback if an element refuses to play. */
  var SR=44100, snd={}, ac=null, lastAt={}, audioReady=false;
  /* Bluetooth headphones sleep their audio route and clip the first ~100-200ms of a sound.
     So: (1) a looping near-silent track keeps the route awake while a workout runs,
     (2) every sound starts with LEAD seconds of near-silence that BT can swallow, and
     (3) sounds are triggered LEAD early so the audible part still lands on the second. */
  var LEAD=0.2, LEAD_MS=LEAD*1000, QUIET=0.0015, keep=null, keepOsc=null, keepGain=null;
  try{ if(navigator.audioSession) navigator.audioSession.type="playback"; }catch(e){}

  function renderBeep(freq,dur,vol){
    var n=Math.floor(SR*dur), d=new Float32Array(n), ph=0, i, t, g;
    for(i=0;i<n;i++){
      t=i/SR;
      g=t<0.006?t/0.006:(t>dur-0.03?Math.max(0,(dur-t)/0.03):1);
      ph+=freq/SR; ph-=Math.floor(ph);
      d[i]=(ph<0.5?1:-1)*vol*g;
    }
    return d;
  }
  /* falling "fahhhh": saw + triangle sweeping 440Hz to 110Hz through a sweeping low-pass */
  function renderFahh(){
    var dur=1.3, n=Math.floor(SR*(dur+0.05)), d=new Float32Array(n), i, t, k, peak=0;
    var p1=0, p2=0, x1=0, x2=0, y1=0, y2=0, b0=0, b1=0, b2=0, a1=0, a2=0, Q=2;
    for(i=0;i<n;i++){
      t=Math.min(i/SR,dur); k=t/dur;
      var f1=440*Math.pow(110/440,k), f2=442*Math.pow(110.5/442,k);
      p1+=f1/SR; p1-=Math.floor(p1); p2+=f2/SR; p2-=Math.floor(p2);
      var x=(2*p1-1)+(Math.abs(4*p2-2)-1);
      if(i%16===0){
        var fc=2600*Math.pow(500/2600,k), w=2*Math.PI*fc/SR, al=Math.sin(w)/(2*Q), c=Math.cos(w), a0=1+al;
        b0=(1-c)/2/a0; b1=(1-c)/a0; b2=b0; a1=-2*c/a0; a2=(1-al)/a0;
      }
      var y=b0*x+b1*x1+b2*x2-a1*y1-a2*y2;
      x2=x1; x1=x; y2=y1; y1=y;
      var g=t<0.05?t/0.05:(t<0.45?1:Math.pow(0.0001,(t-0.45)/(dur-0.45)));
      if(i>=SR*dur) g=0;
      d[i]=y*g; if(Math.abs(d[i])>peak) peak=Math.abs(d[i]);
    }
    /* normalise hard, then soft-clip a touch for extra loudness */
    var s=0.97/(peak||1);
    for(i=0;i<n;i++){ d[i]=Math.tanh(d[i]*s*1.6)/Math.tanh(1.6)*0.98; }
    return d;
  }
  /* LEAD seconds of near-silent noise (non-zero so the route is not idle), then the sound */
  function withLead(d){
    var m=Math.floor(SR*LEAD), o=new Float32Array(m+d.length), i;
    for(i=0;i<m;i++) o[i]=(Math.random()*2-1)*QUIET;
    o.set(d,m);
    return o;
  }
  function renderKeep(){
    var n=SR*3, d=new Float32Array(n), i;
    for(i=0;i<n;i++) d[i]=(Math.random()*2-1)*QUIET;
    return d;
  }
  function wavURI(f32){
    var n=f32.length, buf=new ArrayBuffer(44+n*2), v=new DataView(buf), i;
    function s(o,str){ for(var j=0;j<str.length;j++) v.setUint8(o+j,str.charCodeAt(j)); }
    s(0,"RIFF"); v.setUint32(4,36+n*2,true); s(8,"WAVE"); s(12,"fmt ");
    v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
    v.setUint32(24,SR,true); v.setUint32(28,SR*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
    s(36,"data"); v.setUint32(40,n*2,true);
    for(i=0;i<n;i++){ var x=Math.max(-1,Math.min(1,f32[i])); v.setInt16(44+i*2,x<0?x*32768:x*32767,true); }
    var bytes=new Uint8Array(buf), bin="";
    for(i=0;i<bytes.length;i+=8192) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
    return "data:audio/wav;base64,"+btoa(bin);
  }
  function mk(name,data){
    var a=new Audio();
    a.preload="auto"; a.volume=1; a.setAttribute("playsinline",""); a.setAttribute("webkit-playsinline","");
    a.src=wavURI(data);
    try{ a.load(); }catch(e){}
    snd[name]={el:a,data:data};
  }
  /* real recorded "fah" (mp3, already has 0.2s lead-in baked in). The synthesized one is
     rendered only if the file fails to load. */
  function mkFile(name,url,fallback){
    var a=new Audio(), swapped=false;
    a.preload="auto"; a.volume=1; a.setAttribute("playsinline",""); a.setAttribute("webkit-playsinline","");
    var entry={el:a,data:null};
    function swap(){
      if(swapped) return; swapped=true;
      try{
        entry.data=fallback();
        a.src=wavURI(entry.data);
        try{ a.load(); }catch(e){}
      }catch(e){}
    }
    a.addEventListener("error",swap);
    a.src=url;
    try{ a.load(); }catch(e){}
    snd[name]=entry;
  }
  try{
    mk("start",withLead(renderBeep(1320,0.4,0.95)));
    mk("tick",withLead(renderBeep(880,0.25,0.95)));
    mkFile("fahh","fah.mp3",function(){ return withLead(renderFahh()); });
    audioReady=true;
  }catch(e){}
  try{
    keep=new Audio();
    keep.preload="auto"; keep.loop=true; keep.volume=1;
    keep.setAttribute("playsinline",""); keep.setAttribute("webkit-playsinline","");
    keep.src=wavURI(renderKeep());
    try{ keep.load(); }catch(e){}
  }catch(e){ keep=null; }

  function ensureCtx(){
    try{
      var C=window.AudioContext||window.webkitAudioContext;
      if(!C) return null;
      if(!ac) ac=new C();
      if(ac.state!=="running"&&ac.resume){ var r=ac.resume(); if(r&&r.catch) r.catch(function(){}); }
      return ac;
    }catch(e){ return null; }
  }
  function webAudioFallback(name){
    try{
      var c=ensureCtx(), s=snd[name]; if(!c||!s||!s.data) return;
      var m=Math.floor(SR*LEAD), d=s.data.subarray(m);
      var b=c.createBuffer(1,d.length,SR); b.getChannelData(0).set(d);
      var src=c.createBufferSource(); src.buffer=b; src.connect(c.destination); src.start(0);
    }catch(e){}
  }
  /* must run synchronously inside the START / resume tap (iOS Safari) */
  function initAudio(){
    try{ if(navigator.audioSession) navigator.audioSession.type="playback"; }catch(e){}
    ensureCtx();
    if(!audioReady) return;
    /* "start" is excluded: it is played for real inside this same tap */
    ["tick","fahh"].forEach(function(name){
      var a=snd[name].el;
      try{
        /* a muted play inside the gesture unlocks this element for later script-started play() */
        a.muted=true;
        var p=a.play();
        var done=function(){ try{ a.pause(); a.currentTime=0; }catch(e){} a.muted=false; };
        if(p&&p.then) p.then(done,function(){ a.muted=false; }); else done();
      }catch(e){ a.muted=false; }
    });
  }
  function play(name){
    var s=snd[name]; if(!s){ return; }
    var a=s.el;
    try{
      a.muted=false; a.volume=1;
      try{ a.currentTime=0; }catch(e){}
      var p=a.play();
      if(p&&p.catch) p.catch(function(){ webAudioFallback(name); });
    }catch(e){ webAudioFallback(name); }
  }
  /* keep-alive: looping near-silent track (+ a near-silent oscillator) while a workout runs */
  function keepStart(){
    try{
      if(keep){
        var p=keep.play();
        if(p&&p.catch) p.catch(function(){});
      }
    }catch(e){}
    try{
      var c=ensureCtx();
      if(c&&!keepOsc){
        keepOsc=c.createOscillator(); keepGain=c.createGain();
        keepOsc.frequency.value=20; keepGain.gain.value=0.0005;
        keepOsc.connect(keepGain); keepGain.connect(c.destination); keepOsc.start(0);
      }
    }catch(e){ keepOsc=null; keepGain=null; }
  }
  function keepStop(){
    try{ if(keep){ keep.pause(); try{ keep.currentTime=0; }catch(e){} } }catch(e){}
    try{ if(keepOsc){ keepOsc.stop(0); keepOsc.disconnect(); } if(keepGain) keepGain.disconnect(); }catch(e){}
    keepOsc=null; keepGain=null;
  }
  function setMedia(state){
    try{
      if(!("mediaSession" in navigator)) return;
      if(state==="none"){ navigator.mediaSession.playbackState="none"; return; }
      if(!navigator.mediaSession.metadata && window.MediaMetadata){
        navigator.mediaSession.metadata=new MediaMetadata({title:"Jump Rope",artist:"Interval timer"});
      }
      navigator.mediaSession.playbackState=state;
    }catch(e){}
  }
  function stopSounds(){
    Object.keys(snd).forEach(function(k){ try{ snd[k].el.pause(); snd[k].el.currentTime=0; }catch(e){} });
  }
  /* ignore a repeat of the same sound kind within 'gap' ms (no double play) */
  function once(kind,gap){
    var n=Date.now();
    if(lastAt[kind]&&n-lastAt[kind]<gap) return false;
    lastAt[kind]=n; return true;
  }
  function buzz(p){ if(navigator.vibrate) try{navigator.vibrate(p);}catch(e){} }
  function tick(){ if(once("tick",400)){ play("tick"); buzz(25); } }
  function startBeep(){ if(once("start",400)){ play("start"); buzz([120]); } }
  var preFired=false, fahhEnd=0;
  /* the fahhhh is triggered LEAD early (see frame), so here only vibrate if it already started */
  function change(phase){
    if(!once("change",600)) return;
    if(preFired){ preFired=false; }
    else{ stopSounds(); if(once("fahh",600)) play("fahh"); }
    buzz(phase==="jump"?[220]:[120,80,120]);
  }

  /* ---------- wake lock ---------- */
  var lock=null;
  function wake(){
    try{
      if(!("wakeLock" in navigator)||lock) return;
      navigator.wakeLock.request("screen").then(function(l){
        lock=l; l.addEventListener("release",function(){ lock=null; });
      }).catch(function(){});
    }catch(e){}
  }
  function unwake(){ try{ if(lock){ lock.release(); } }catch(e){} lock=null; }
  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState==="visible"&&running&&!paused){
      wake();
      try{ if(keep&&keep.paused) keepStart(); }catch(e){}
    }
  });

  /* ---------- timer ---------- */
  var running=false, paused=false;
  var phase="jump", round=1;
  var phaseStart=0, phaseEnd=0, remainingAtPause=0, lastShown=-1, lastK=-1;
  var raf=0, iv=0;
  var elCount=$("count"), elPhase=$("phase"), elRound=$("round"), elBar=$("bar");

  function dur(p){ return S[p]*1000; }
  function paintPhase(){
    body.setAttribute("data-phase",phase);
    elPhase.textContent=paused?"Paused":(phase==="jump"?"Jump":"Rest");
    elRound.textContent="Round "+round;
  }
  function begin(p,startAt){
    phase=p; phaseStart=startAt; phaseEnd=startAt+dur(p); lastShown=-1; lastK=-1;
  }
  function frame(){
    if(!running||paused) return;
    var now=Date.now(), changed=false;
    while(now>=phaseEnd){
      var next=phase==="jump"?"rest":"jump";
      if(next==="jump") round++;
      begin(next,phaseEnd); changed=true;
    }
    if(changed){ paintPhase(); change(phase); }
    var left=phaseEnd-now;
    var shown=Math.ceil(left/1000);
    if(shown!==lastShown){
      elCount.textContent=shown;
      lastShown=shown;
    }
    /* sounds are triggered LEAD early: the audible part lands exactly on the second */
    var k=Math.ceil((left-LEAD_MS)/1000);
    if(k!==lastK){
      if(!changed&&k<=3&&k>=1&&lastK>k) tick();
      lastK=k;
    }
    if(left<=LEAD_MS&&fahhEnd!==phaseEnd){
      fahhEnd=phaseEnd;
      if(once("fahh",600)){ stopSounds(); play("fahh"); preFired=true; }
    }
    elBar.style.transform="scaleX("+Math.min(1,(now-phaseStart)/(phaseEnd-phaseStart))+")";
  }
  function loop(){ frame(); raf=requestAnimationFrame(loop); }

  function start(){
    initAudio();
    preFired=false; fahhEnd=0;
    keepStart(); setMedia("playing");
    running=true; paused=false; round=1;
    body.classList.remove("paused");
    body.setAttribute("data-view","run");
    begin("jump",Date.now());
    elBar.style.transition="none"; elBar.style.transform="scaleX(0)";
    elCount.textContent=S.jump;
    paintPhase(); startBeep();
    wake();
    cancelAnimationFrame(raf); clearInterval(iv);
    raf=requestAnimationFrame(loop);
    iv=setInterval(frame,250); /* keeps ticking if rAF is throttled */
  }
  function stop(){
    running=false; paused=false;
    cancelAnimationFrame(raf); clearInterval(iv);
    stopSounds(); keepStop(); setMedia("none"); preFired=false; fahhEnd=0; unwake();
    body.classList.remove("paused");
    body.setAttribute("data-view","setup");
    paintSetup();
  }
  function toggle(){
    if(!running) return;
    initAudio();
    if(!paused){
      paused=true; remainingAtPause=phaseEnd-Date.now();
      body.classList.add("paused");
      stopSounds(); keepStop(); setMedia("paused"); preFired=false; unwake();
    }else{
      paused=false;
      keepStart(); setMedia("playing");
      var now=Date.now();
      phaseEnd=now+remainingAtPause; phaseStart=phaseEnd-dur(phase);
      body.classList.remove("paused");
      wake();
    }
    paintPhase();
  }

  try{
    if("mediaSession" in navigator){
      navigator.mediaSession.setActionHandler("play",function(){ if(running&&paused) toggle(); });
      navigator.mediaSession.setActionHandler("pause",function(){ if(running&&!paused) toggle(); });
    }
  }catch(e){}
  $("start").addEventListener("click",start);
  $("stop").addEventListener("click",function(e){ e.stopPropagation(); stop(); });
  $("run").addEventListener("click",toggle);
  document.addEventListener("keydown",function(e){
    if(e.key===" "||e.code==="Space"){
      if(running){ e.preventDefault(); toggle(); }
      else if(document.activeElement===document.body){ e.preventDefault(); start(); }
    }else if(e.key==="Escape"&&running) stop();
  });

  paintTheme(); paintSetup();
  /* test hook (harmless) */
  window.__jr={state:function(){return {running:running,paused:paused,phase:phase,round:round};}};
})();
</script>
